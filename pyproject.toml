[project]
name = "pharmacy-super-admin"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.121.1",
  "uvicorn==0.38.0",
  "SQLAlchemy==2.0.44",
  "psycopg[binary]==3.2.12",
  "cryptography==46.0.3",
  "argon2-cffi==25.1.0",
]

[tool.vercel]
entrypoint = "super_admin.backend.app:app"

[tool.vercel.scripts]
build = "python -m super_admin.backend.build_frontend"
